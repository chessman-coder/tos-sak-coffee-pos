[build]
builder = "NIXPACKS"

[deploy]
startCommand = "mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions bootstrap/cache && php artisan migrate --force && php artisan db:seed --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan storage:link && exec php -S 0.0.0.0:${PORT:-8080} -t public public/server.php"
